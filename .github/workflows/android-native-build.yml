name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-native-${{ runner.os }}-${{ hashFiles('android-native/**/*.gradle*', 'android-native/**/gradle-wrapper.properties') }}
          restore-keys: gradle-native-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x android-native/gradlew

      - name: Build release APK
        working-directory: android-native
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quick-ssh-tunnel-native-apk
          path: android-native/app/build/outputs/apk/release/*.apk
          retention-days: 30
